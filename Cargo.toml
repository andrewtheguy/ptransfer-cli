[package]
name = "ptransfer-cli"
# does not have to match pTransfer's npm version
version = "0.0.2"
edition = "2024"
publish = false

[package.metadata]
# The interoperable protocol version this build implements: INTEROP_PROTOCOL_VERSION
# in the pTransfer web app's src/lib/protocol.ts, specified by its
# docs/INTEROP_PROTOCOL.md. Deliberately not pTransfer's npm version — that moves
# for web-only changes (Code Exchange, the relay fallback) this CLI does not implement.
ptransfer-protocol-version = "2"

[lib]
name = "ptransfer_cli"
path = "src/lib.rs"

[[bin]]
name = "ptransfer"
path = "src/main.rs"

[features]
default = []
# Experimental CLI-to-CLI transport over a Tor v3 onion service (proof of
# concept). Off by default: it drags in the whole Arti dependency tree, which
# roughly doubles build time for a code path the file transfer does not use yet.
tor = [
    "dep:arti-client",
    "dep:tor-cell",
    "dep:tor-config",
    "dep:tor-hsservice",
    "dep:tor-keymgr",
    "dep:tor-proto",
    "dep:tor-rtcompat",
    "dep:safelog",
    "dep:tempfile",
]

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Randomness (nonces, salts, ECDH scalars, PINs)
getrandom = "0.2"

# pTransfer-compatible crypto
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"

# Raw-DEFLATE wire encoding for single-file transfers. Also supplies the zlib
# backend the zip crate's deflate-flate2 feature needs (it depends on flate2
# with default features off), so this must keep its default features.
flate2 = "1"

# Multi-file/folder packaging (streamed directly into the transfer)
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# Local-time archive-name timestamps (matches pTransfer's archiveTimestamp)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Nostr signaling
nostr-sdk = "0.44.1"

# WebRTC transport
rtc = "0.9.1"
bytes = "1"
if-addrs = "0.15"

# Tor onion-service transport (feature "tor"). Arti 2.5.1 == crates 0.45.
# arti-client's default features pull in native-tls; this crate already installs
# an aws-lc-rs rustls provider process-wide, which is exactly what
# tor-rtcompat's rustls backend picks up, so use that instead of adding OpenSSL.
arti-client = { version = "0.45", optional = true, default-features = false, features = [
    "tokio",
    "rustls",
    "compression",
    "flowctl-cc",
    "keymgr",
    "onion-service-client",
    "onion-service-service",
    "ephemeral-keystore",
    "vanguards",
    # Arti's directory cache is SQLite. Bundle it so the released binary stays
    # standalone instead of needing a system libsqlite3.
    "static-sqlite",
] }
tor-cell = { version = "0.45", optional = true }
tor-config = { version = "0.45", optional = true }
tor-hsservice = { version = "0.45", optional = true }
tor-keymgr = { version = "0.45", optional = true, features = ["ephemeral-keystore"] }
tor-proto = { version = "0.45", optional = true, features = ["hs-service", "tokio"] }
tor-rtcompat = { version = "0.45", optional = true, default-features = false, features = ["tokio", "rustls"] }
# Printing the .onion address in full; Arti redacts it by default.
safelog = { version = "0.9", optional = true }
# Backing directory for Arti's state/cache; see src/tor/storage.rs.
tempfile = { version = "3", optional = true }

# CLI (arg parsing + logging)
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

# TUI wizard
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
# `start_paused` runtimes, so a test can cross a timeout without waiting it out.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
