[package]
name = "ptransfer-cli"
# does not have to match pTransfer's npm version
version = "0.0.1"
edition = "2024"
publish = false

[package.metadata]
# The interoperable protocol version this build implements: INTEROP_PROTOCOL_VERSION
# in the pTransfer web app's src/lib/protocol.ts, specified by its
# docs/INTEROP_PROTOCOL.md. Deliberately not pTransfer's npm version — that moves
# for web-only changes (Code Exchange, the relay fallback) this CLI does not implement.
ptransfer-protocol-version = "2"

[lib]
name = "ptransfer_cli"
path = "src/lib.rs"

[[bin]]
name = "ptransfer"
path = "src/main.rs"

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Randomness (nonces, salts, ECDH scalars, PINs)
getrandom = "0.2"

# pTransfer-compatible crypto
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"

# Raw-DEFLATE wire encoding for single-file transfers. Also supplies the zlib
# backend the zip crate's deflate-flate2 feature needs (it depends on flate2
# with default features off), so this must keep its default features.
flate2 = "1"

# Multi-file/folder packaging (streamed directly into the transfer)
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# Local-time archive-name timestamps (matches pTransfer's archiveTimestamp)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Nostr signaling
nostr-sdk = "0.44.1"

# WebRTC transport
rtc = "0.9.1"
bytes = "1"
if-addrs = "0.15"

# CLI (arg parsing + logging)
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

# TUI wizard
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
