[package]
name = "ptransfer-cli"
# does not have to match pTransfer's npm version
version = "0.0.10"
edition = "2024"
publish = false

[package.metadata]
# The interoperable protocol version this build implements: INTEROP_PROTOCOL_VERSION
# in the pTransfer web app's src/lib/protocol.ts, specified by its
# docs/INTEROP_PROTOCOL.md, which covers PIN Exchange and the shared
# data-channel transfer layer. Deliberately not pTransfer's npm version — that
# moves for web-only changes (the multi-QR codes) this CLI does not implement.
# The modes outside that document — Code Exchange, its two fallbacks, anonymous
# signaling, the Tor transport — carry their own contracts and are not
# versioned here.
ptransfer-protocol-version = "4"

[lib]
name = "ptransfer_cli"
path = "src/lib.rs"

[[bin]]
name = "ptransfer"
path = "src/main.rs"

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Randomness (nonces, salts, ECDH scalars, PINs)
getrandom = "0.2"

# pTransfer-compatible crypto
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"

# Raw-DEFLATE wire encoding for single-file transfers. Also supplies the zlib
# backend the zip crate's deflate-flate2 feature needs (it depends on flate2
# with default features off), so this must keep its default features.
flate2 = "1"

# Multi-file/folder packaging (streamed directly into the transfer)
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# Local-time archive-name timestamps (matches pTransfer's archiveTimestamp)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Nostr signaling
nostr-sdk = "0.44.1"
# The relay cache's home: the platform's per-user cache directory.
dirs = "6"

# Anonymous signaling: the PIN Exchange handshake carried to
# onion-service Nostr relays over the Tor client this crate already assembles.
#
# `nostr-sdk` exposes the WebSocket transport as a trait, so the only thing
# missing is a socket. `tokio-tungstenite` supplies the client handshake, which
# is the one piece that has to run *inside* a stream opened elsewhere — its
# `connect` and TLS features are off for exactly that reason: an onion circuit
# is already authenticated by the key the address commits to, and nothing here
# ever dials a host itself. `async-wsocket` is only where the message type in
# the trait's signature lives (nostr-sdk re-exports the trait but not the type)
# along with its tungstenite conversions; none of its own connectors are used.
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "handshake",
] }
async-wsocket = { version = "0.13", default-features = false }

# WebRTC transport
rtc = "0.9.1"
bytes = "1"
if-addrs = "0.15"

# Tor onion-service transport. Arti 2.5.1 == crates 0.45.
#
# Deliberately *not* arti-client. `arti-client` reaches the network through
# `tor-dirmgr` and `tor-hsservice`, and those two are the only pieces of Arti
# that insist on a filesystem: `tor-dirmgr` opens a SQLite database plus a
# `dir_blobs/` directory, and `tor-hsservice` wants a `tor_persist::StateDirectory`
# whose `raw_subdir` hands out real files. Neither exposes a seam to swap that
# out — `tor-dirmgr`'s `Store` is `pub(crate)`, and `StateDirectory` is a
# concrete type — which is arti#1186, unscheduled upstream.
#
# So this crate assembles the client from the layers below those two, all of
# which take their storage as a trait we can satisfy from memory:
# `GuardMgr`/`VanguardMgr`/`CircMgr` take any `tor_persist::StateMgr` (see
# src/tor/memstate.rs), and everything reads the directory through
# `tor_netdir::NetDirProvider`, which src/tor/netdir.rs implements over a
# `NetDir` held in an `Arc<RwLock<..>>`. Nothing here touches a path.
#
# Keeping tor-chanmgr matters for more than convenience: relay TLS is
# self-signed by design and the relay is authenticated by the CERTS cell
# instead, so writing our own link handshake would mean writing our own
# "accept any certificate" verifier. This way that check stays Arti's.
tor-chanmgr = "0.45"
tor-circmgr = { version = "0.45", features = [
    "hs-client",
    "hs-service",
    "vanguards",
    "specific-relay",
    "send-control-msg",
] }
tor-guardmgr = { version = "0.45", features = ["vanguards"] }
tor-hsclient = "0.45"
tor-proto = { version = "0.45", features = [
    "hs-client",
    "hs-service",
    "send-control-msg",
    "tokio",
] }
tor-rtcompat = { version = "0.45", default-features = false, features = ["tokio", "rustls"] }

# Directory: fetched over the network into memory, never cached to disk.
# tor-dircommon carries the built-in authority and fallback lists, so the trust
# anchors are Arti's own rather than a copy of them in this repo.
tor-dircommon = "0.45"
tor-dirclient = { version = "0.45", features = ["hs-service"] }
tor-netdir = { version = "0.45", features = ["hs-client", "hs-service"] }
tor-netdoc = { version = "0.45", features = ["hs-client", "hs-service"] }
# Consensus and certificate timeliness/signature checking; see src/tor/netdir.rs.
tor-checkable = "0.45"

tor-bytes = "0.45"
tor-cell = { version = "0.45", features = ["hs"] }
# `ope` is the order-preserving encryption a service uses to make descriptor
# revision counters that do not leak this machine's clock skew.
tor-hscrypto = { version = "0.45", features = ["ope"] }
tor-linkspec = { version = "0.45", features = ["decode", "verbatim"] }
tor-llcrypto = "0.45"
tor-memquota = "0.45"
tor-protover = "0.45"
tor-persist = "0.45"
tor-error = "0.45"
# Channels between the circuit reactors and the onion service's own tasks.
futures-channel = "0.3"
# Onion-service key generation (identity, per-introduction-point session keys).
rand = "0.10"
# Watch channels for the directory-change events `NetDirProvider` publishes.
postage = "0.5"
# Printing the .onion address in full; Arti redacts it by default.
safelog = "0.9"

# CLI (arg parsing + logging)
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

# TUI wizard
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[dev-dependencies]
tempfile = "3"
# `start_paused` runtimes, so a test can cross a timeout without waiting it out.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
